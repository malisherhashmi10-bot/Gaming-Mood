<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DARK HACKER Celebration</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#080414}
#game{
  position:relative;width:100%;height:100vh;overflow:hidden;
  background:linear-gradient(#10052d 0%,#25064b 45%,#5b174d 68%,#160d22 100%);
}
#skyGlow{position:absolute;inset:0;background:radial-gradient(circle at 50% 48%,rgba(255,180,70,.35),transparent 42%);pointer-events:none}
#title{
 position:absolute;top:18px;left:50%;transform:translateX(-50%);
 z-index:30;color:#ffd76a;font-size:clamp(28px,7vw,62px);font-weight:900;
 letter-spacing:7px;text-shadow:0 0 8px #ff9d00,0 0 25px #ff6a00;
}
#road{
 position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);
 width:115%;height:72%;background:linear-gradient(90deg,#241b2c,#5d4350 50%,#241b2c);
 clip-path:polygon(32% 0,68% 0,100% 100%,0 100%);
}
#roadLine{
 position:absolute;left:50%;bottom:-5%;transform:translateX(-50%);
 width:7px;height:72%;background:repeating-linear-gradient(to bottom,#ffdca0 0 45px,transparent 45px 90px);
 opacity:.65;
}
#wall{
 position:absolute;z-index:8;left:50%;top:39%;transform:translate(-50%,-50%);
 width:min(88vw,850px);height:min(34vh,260px);
 border:10px solid #3a2430;border-radius:18px;
 background:linear-gradient(#3d2634,#211725);
 box-shadow:0 0 35px #ff8c00, inset 0 0 35px #000;
}
#wall:before{
 content:"";position:absolute;inset:12px;border:3px solid #e3a84d;border-radius:8px;opacity:.8;
}
#darkhacker{
 position:absolute;z-index:10;left:50%;top:50%;transform:translate(-50%,-50%);
 white-space:nowrap;font-size:clamp(32px,9vw,100px);font-weight:1000;letter-spacing:clamp(3px,1vw,12px);
 color:#ffd76a;text-shadow:0 0 5px #fff0a8,0 0 15px #ff9d00,0 0 35px #ff4d00;
}
#crown{position:absolute;left:50%;top:-32px;transform:translateX(-50%);font-size:55px;z-index:12}
#runner{
 position:absolute;z-index:15;left:50%;bottom:8%;transform:translateX(-50%);
 width:52px;height:90px;background:#17131e;border-radius:25px 25px 12px 12px;
 transition:left .18s;
}
#runner:before{
 content:"";position:absolute;width:43px;height:43px;left:4px;top:-36px;border-radius:50%;background:#d69a72;
}
.leg{position:absolute;width:15px;height:48px;background:#111;bottom:-36px;border-radius:10px}
.leg.l{left:7px;transform:rotate(8deg)}.leg.r{right:7px;transform:rotate(-8deg)}
.arm{position:absolute;width:12px;height:48px;background:#17131e;top:18px;border-radius:10px}
.arm.l{left:-10px;transform:rotate(18deg)}.arm.r{right:-10px;transform:rotate(-18deg)}
.running .leg.l{animation:runL .25s infinite alternate}.running .leg.r{animation:runR .25s infinite alternate}
@keyframes runL{to{transform:rotate(-25deg) translateY(-5px)}}@keyframes runR{to{transform:rotate(25deg) translateY(-5px)}}
.dancing{animation:dance .38s infinite alternate}
@keyframes dance{from{transform:translateX(-50%) rotate(-8deg) translateY(0)}to{transform:translateX(-50%) rotate(8deg) translateY(-10px)}}

.crowd{position:absolute;z-index:12;bottom:0;width:100%;height:25%;display:flex;justify-content:space-around;align-items:flex-end}
.person{width:30px;height:80px;background:#191521;border-radius:18px 18px 3px 3px;position:relative}
.person:before{content:"";position:absolute;width:25px;height:25px;background:#c98569;border-radius:50%;top:-19px;left:3px}
.person:nth-child(2n){height:105px}.person:nth-child(3n){height:65px}
.person{animation:cheer .55s infinite alternate}
.person:nth-child(2n){animation-delay:.2s}.person:nth-child(3n){animation-delay:.35s}
@keyframes cheer{to{transform:translateY(-10px) rotate(5deg)}}

#controls{position:absolute;z-index:40;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
button{
 border:2px solid #ffd76a;background:rgba(20,8,30,.82);color:#fff;
 padding:13px 24px;border-radius:30px;font-size:17px;font-weight:bold;
 box-shadow:0 0 15px rgba(255,170,50,.4);touch-action:manipulation;
}
#start{
 position:absolute;z-index:50;inset:0;display:flex;align-items:center;justify-content:center;
 background:rgba(5,1,12,.65)
}
.panel{text-align:center;background:rgba(25,9,34,.94);border:2px solid #d89a40;border-radius:22px;padding:30px 24px;max-width:90%}
.panel h2{color:#ffd76a;font-size:38px;margin-bottom:10px}.panel p{color:#fff;margin-bottom:20px}
#celebrate{display:none;position:absolute;z-index:35;inset:0;pointer-events:none}
.celebrate #celebrate{display:block}
.firework{position:absolute;font-size:55px;animation:boom .8s infinite}
.f1{left:8%;top:16%}.f2{right:8%;top:13%;animation-delay:.25s}.f3{left:45%;top:8%;animation-delay:.5s}
@keyframes boom{0%,100%{transform:scale(.55);opacity:.5}50%{transform:scale(1.25);opacity:1}}
.petals{position:absolute;inset:0;overflow:hidden}
.petal{position:absolute;top:-30px;font-size:24px;animation:fall 4s linear infinite}
@keyframes fall{to{transform:translateY(115vh) rotate(360deg)}}
.hint{font-size:13px;color:#d8c5d8;margin-top:10px}
</style>
</head>
<body>
<div id="game">
  <div id="skyGlow"></div>
  <div id="title">DARK-HACKER</div>
  <div id="road"></div><div id="roadLine"></div>

  <div id="wall">
    <div id="crown">👑</div>
    <div id="darkward">DARK-HACKER</div>
  </div>

  <div id="runner" class="running">
    <div class="arm l"></div><div class="arm r"></div>
    <div class="leg l"></div><div class="leg r"></div>
  </div>

  <div class="crowd">
    <div class="person"></div><div class="person"></div><div class="person"></div>
    <div class="person"></div><div class="person"></div><div class="person"></div>
    <div class="person"></div><div class="person"></div><div class="person"></div>
  </div>

  <div id="celebrate">
    <div class="firework f1">🎆</div><div class="firework f2">🎇</div><div class="firework f3">🎆</div>
    <div class="petals" id="petals"></div>
  </div>

  <div id="controls">
    <button id="left">😘 LEFT</button>
    <button id="dance">💃 DANCE</button>
    <button id="right">RIGHT 🥰</button>
  </div>

  <div id="start">
    <div class="panel">
      <h2>DARK-HACKER</h2>
      <p>Celebration شروع کرنے کے لیے START دبائیں</p>
      <button id="startBtn">START</button>
      <div class="hint">شروع ہوتے ہی اینیمی DARK-HACKER کی دیوار تک پہنچے گا۔</div>
    </div>
  </div>
</div>

<script>
const runner=document.getElementById('runner');
const start=document.getElementById('start');
const celebrate=document.getElementById('celebrate');
const petals=document.getElementById('petals');
let started=false, x=50;

function move(dir){
  if(!started) return;
  x=Math.max(25,Math.min(75,x+dir*8));
  runner.style.left=x+'%';
}
document.getElementById('left').addEventListener('click',()=>move(-1));
document.getElementById('right').addEventListener('click',()=>move(1));

function makePetals(){
  petals.innerHTML='';
  for(let i=0;i<45;i++){
    const p=document.createElement('span');
    p.className='petal';
    p.textContent=['🌸','🌺','😍','😎','😇','🤩','🥹','😘','🫂','🌼','🌷'][Math.floor(Math.random()*4)];
    p.style.left=Math.random()*100+'%';
    p.style.animationDelay=(Math.random()*3)+'s';
    p.style.animationDuration=(3+Math.random()*3)+'s';
    petals.appendChild(p);
  }
}

function celebration(){
  runner.classList.remove('running');
  runner.classList.add('dancing');
  celebrate.classList.add('show');
  makePetals();
  document.getElementById('celebrate').style.display='block';
}

document.getElementById('dance').addEventListener('click',()=>{
  if(started) celebration();
});

document.getElementById('startBtn').addEventListener('click',()=>{
  started=true;
  start.style.display='none';
  runner.classList.add('running');
  // پہلے اینیمی سامنے موجود DARK-HACKER دیوار کی طرف پہنچتا ہے
  setTimeout(celebration,3500);
});

document.addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft') move(-1);
  if(e.key==='ArrowRight') move(1);
  if(e.code==='Space' && started) celebration();
});
</script>
</body>
</html>
